<script>
  // Pick the colour theme before the page paints: the visitor's stored choice, else the system setting.
  // data-theme drives the chart colours (style.css); jtd.setTheme swaps the Just the Docs stylesheet.
  (function () {
    var t = null;
    try { t = localStorage.getItem("theme"); } catch (e) { /* storage unavailable */ }
    if (!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
    if (t === "dark" && window.jtd && jtd.setTheme) jtd.setTheme("dark");
  })();
</script>
